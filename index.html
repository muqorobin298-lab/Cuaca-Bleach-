<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuaca Bleach</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #ff6a00; --spark: #ffcf8a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', Arial, sans-serif;
      background: #050510; color: #f5f5f5;
      min-height: 100vh; display: flex;
      justify-content: center; align-items: flex-start;
      padding: 40px 20px; overflow-x: hidden;
    }
    #scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .layer { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
    .layer.aktif { opacity: 1; }
    .kanji {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 45vw; font-weight: 900; color: #fff; opacity: 0.06; white-space: nowrap;
    }
    .orb { position: absolute; top: 9%; right: 10%; width: clamp(120px, 22vw, 260px); aspect-ratio: 1; border-radius: 50%; }
    .city { position: absolute; bottom: 0; left: 0; width: 100%; height: 36vh; }
    #sparks { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .spark {
      position: absolute; bottom: -10px; border-radius: 50%;
      background: var(--spark); box-shadow: 0 0 8px var(--spark);
      opacity: 0; animation: naik linear infinite;
    }
    @keyframes naik {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      10%  { opacity: 0.9; }
      100% { transform: translateY(-105vh) translateX(40px); opacity: 0; }
    }

    .box {
      position: relative; z-index: 1;
      background: rgba(8,8,18,0.85); backdrop-filter: blur(4px);
      border-left: 8px solid var(--accent);
      width: 100%; max-width: 580px; padding: 28px 24px;
      transition: border-color 1s;
    }
    h1 { font-family: 'Anton', Impact, sans-serif; font-size: 34px; letter-spacing: 3px; text-transform: uppercase; }
    h1 span { color: var(--accent); transition: color 1s; }
    .lokasi {
      font-family: 'Anton', Impact, sans-serif; letter-spacing: 3px; font-size: 13px;
      color: var(--accent); margin: 2px 0 16px; text-transform: uppercase; transition: color 1s;
    }
    .cari { display: flex; gap: 8px; margin-bottom: 18px; }
    input {
      flex: 1; font-family: inherit; font-size: 16px; padding: 12px;
      background: rgba(255,255,255,0.08); border: 2px solid #f5f5f5; color: #fff; outline: none;
    }
    input:focus { border-color: var(--accent); }
    .btn {
      font-family: 'Anton', Impact, sans-serif; font-size: 16px; letter-spacing: 2px; text-transform: uppercase;
      background: var(--accent); color: #000; border: none; padding: 0 20px; cursor: pointer; transition: background 1s;
    }
    .btn:hover { background: #fff; }
    .pesan { font-size: 14px; min-height: 20px; margin-bottom: 10px; opacity: 0.85; }
    .pesan.error { color: #ff6b6b; opacity: 1; }
    .sekarang { text-align: center; padding: 10px 0 22px; }
    .kota { font-family: 'Anton', Impact, sans-serif; font-size: 22px; letter-spacing: 3px; text-transform: uppercase; }
    .suhu { font-family: 'Anton', Impact, sans-serif; font-size: 96px; line-height: 1.05; color: var(--accent); transition: color 1s; }
    .kondisi { font-size: 18px; letter-spacing: 1px; margin-bottom: 14px; }
    .detail { display: flex; justify-content: center; gap: 22px; flex-wrap: wrap; font-size: 14px; opacity: 0.85; }
    h2 {
      font-family: 'Anton', Impact, sans-serif; font-size: 20px; letter-spacing: 3px; text-transform: uppercase;
      border-left: 6px solid var(--accent); padding-left: 10px; margin-bottom: 12px; transition: border-color 1s;
    }
    .hari { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .kartu {
      background: rgba(255,255,255,0.07); border-top: 3px solid var(--accent);
      padding: 10px 4px; text-align: center; transition: border-color 1s;
    }
    .kartu b { display: block; font-size: 12px; letter-spacing: 1px; margin-bottom: 6px; }
    .kartu .ik { font-size: 26px; }
    .kartu .mx { font-family: 'Anton', Impact, sans-serif; font-size: 18px; }
    .kartu .mn { font-size: 12px; opacity: 0.7; }
    .hidden { display: none; }
    footer { margin-top: 18px; font-size: 11px; letter-spacing: 1px; opacity: 0.5; text-align: center; }
  
    /* ===== TOMBOL KEMBALI KE MENU AWAL (PORTOFOLIO ROBIN) ===== */
    .menu-robin {
      position: fixed; left: 14px; bottom: 14px; z-index: 50;
      font-family: 'Anton', Impact, sans-serif; font-size: 14px; letter-spacing: 2px; text-transform: uppercase;
      text-decoration: none; color: #f5f5f5;
      background: rgba(8,8,18,0.85); border: 2px solid #f5f5f5;
      padding: 8px 14px; transition: all 0.2s;
    }
    .menu-robin:hover { background: #f5f5f5; color: #000; transform: translateY(-2px); }
    body { padding-bottom: 64px !important; }
  </style>
</head>
<body>
  <a class="menu-robin" href="https://muqorobin298-lab.github.io/Robin_Dev/">← Menu Awal</a>

  <div id="scene"></div>
  <div id="sparks"></div>

  <div class="box">
    <h1>Cuaca <span>Bleach</span></h1>
    <p class="lokasi" id="lokasi"></p>

    <div class="cari">
      <input id="kotaInput" placeholder="Ketik nama kota, misal Jakarta" value="Jakarta">
      <button class="btn" id="cariBtn">Cari</button>
    </div>
    <p class="pesan" id="pesan"></p>

    <div id="hasil" class="hidden">
      <div class="sekarang">
        <div class="kota" id="kota"></div>
        <div class="suhu" id="suhu"></div>
        <div class="kondisi" id="kondisi"></div>
        <div class="detail" id="detail"></div>
      </div>
      <h2>5 Hari ke Depan</h2>
      <div class="hari" id="hari"></div>
    </div>
    <footer>Data cuaca: Open-Meteo.com</footer>
  </div>

  <script>
    // Tiap kondisi cuaca = satu tema latar
    const tema = {
      cerah:  { nama: "Senja Karakura", kanji: "代行", g: "linear-gradient(to top,#ff7b3d,#c2410c 40%,#3b1d5e 100%)", orb: "radial-gradient(circle,#fff3c4 0%,#ffd27a 60%,#ff9a3c 100%)", glow: "#ffb347", city: "#1a0a12", accent: "#ff6a00", spark: "#ffcf8a" },
      berawan:{ nama: "Soul Society", kanji: "死神", g: "linear-gradient(to top,#3b1d5e,#1a1040 45%,#050510 100%)", orb: "radial-gradient(circle,#fff6dc 0%,#fff1d0 70%,#ffe2a0 100%)", glow: "#fff1d0", city: "#000000", accent: "#a855f7", spark: "#e0c8ff" },
      hujan:  { nama: "Malam Bersalju", kanji: "月", g: "linear-gradient(to top,#2a4a7a,#10234a 50%,#030818 100%)", orb: "radial-gradient(circle,#ffffff 0%,#dbeafe 70%,#a5c8ff 100%)", glow: "#bcd8ff", city: "#050b1a", accent: "#4da6ff", spark: "#d6e8ff" },
      kabut:  { nama: "Hujan Sakura", kanji: "桜", g: "linear-gradient(to top,#ff9ec4,#a8326b 45%,#2a0b2e 100%)", orb: "radial-gradient(circle,#fff0f6 0%,#ffc2da 70%,#ff8fba 100%)", glow: "#ffb3d1", city: "#1f0720", accent: "#ff5c9e", spark: "#ffd0e3" },
      badai:  { nama: "BANKAI!", kanji: "卍解", g: "linear-gradient(to top,#ff7b3d,#7a0b1b 45%,#2b0008 100%)", orb: "radial-gradient(circle,#fffbe0 0%,#ffe9b0 60%,#ffd400 100%)", glow: "#ffd400", city: "#1a0004", accent: "#ffd400", spark: "#ffe28a" },
      dingin: { nama: "Istana Es", kanji: "氷", g: "linear-gradient(to top,#b8ecff,#2a8fc7 45%,#062a4d 100%)", orb: "radial-gradient(circle,#ffffff 0%,#e0f7ff 70%,#9fe3ff 100%)", glow: "#aeeaff", city: "#04182e", accent: "#38d4ff", spark: "#ffffff" }
    };
    const urutan = Object.keys(tema);

    const kota = `<svg class="city" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice" fill="CITYCOLOR">
      <rect x="0" y="270" width="1200" height="30"/>
      <path d="M90 270 V190 H130 V270 Z"/><path d="M70 195 Q110 185 150 195 L135 170 H85 Z"/><path d="M85 170 Q110 160 135 170 L125 150 H95 Z"/><path d="M95 150 L110 125 L125 150 Z"/>
      <path d="M200 270 V215 H420 V270 Z"/><path d="M180 220 Q310 195 440 220 L410 200 H210 Z"/>
      <path d="M520 270 V160 H580 V270 Z"/><path d="M495 165 Q550 150 605 165 L585 135 H515 Z"/><path d="M512 135 Q550 120 588 135 L575 108 H525 Z"/><path d="M525 108 Q550 95 575 108 L562 82 H538 Z"/><path d="M540 82 L550 50 L560 82 Z"/>
      <path d="M680 270 V220 H860 V270 Z"/><path d="M660 225 Q770 200 880 225 L850 205 H690 Z"/>
      <path d="M930 270 V185 H980 V270 Z"/><path d="M910 190 Q955 178 1000 190 L985 165 H925 Z"/><path d="M925 165 Q955 152 985 165 L975 140 H935 Z"/><path d="M938 140 L955 112 L972 140 Z"/>
      <path d="M1060 270 V225 H1200 V270 Z"/><path d="M1045 230 Q1130 208 1215 230 L1190 212 H1070 Z"/>
    </svg>`;

    const scene = document.getElementById("scene");
    const layers = {};
    urutan.forEach(k => {
      const t = tema[k];
      const d = document.createElement("div");
      d.className = "layer";
      d.style.background = t.g;
      d.innerHTML =
        '<div class="kanji">' + t.kanji + '</div>' +
        '<div class="orb" style="background:' + t.orb + ';box-shadow:0 0 40px ' + t.glow + ',0 0 110px ' + t.glow + '"></div>' +
        kota.replace("CITYCOLOR", t.city);
      scene.appendChild(d);
      layers[k] = d;
    });

    const sparks = document.getElementById("sparks");
    for (let n = 0; n < 35; n++) {
      const s = document.createElement("div");
      s.className = "spark";
      const size = 2 + Math.random() * 4;
      s.style.width = s.style.height = size + "px";
      s.style.left = Math.random() * 100 + "%";
      s.style.animationDuration = (6 + Math.random() * 8) + "s";
      s.style.animationDelay = (Math.random() * 10) + "s";
      sparks.appendChild(s);
    }

    function gantiTema(k) {
      const t = tema[k];
      urutan.forEach(n => layers[n].classList.toggle("aktif", n === k));
      document.documentElement.style.setProperty("--accent", t.accent);
      document.documentElement.style.setProperty("--spark", t.spark);
      document.getElementById("lokasi").textContent = "// " + t.nama;
    }

    // ===== KODE CUACA (WMO) =====
    function infoCuaca(kode) {
      if (kode === 0) return { teks: "Cerah", ik: "☀️", tema: "cerah" };
      if (kode <= 2) return { teks: "Cerah berawan", ik: "🌤️", tema: "cerah" };
      if (kode === 3) return { teks: "Berawan", ik: "☁️", tema: "berawan" };
      if (kode === 45 || kode === 48) return { teks: "Berkabut", ik: "🌫️", tema: "kabut" };
      if (kode >= 51 && kode <= 57) return { teks: "Gerimis", ik: "🌦️", tema: "hujan" };
      if (kode >= 61 && kode <= 67) return { teks: "Hujan", ik: "🌧️", tema: "hujan" };
      if (kode >= 71 && kode <= 77) return { teks: "Salju", ik: "❄️", tema: "dingin" };
      if (kode >= 80 && kode <= 82) return { teks: "Hujan lebat", ik: "🌧️", tema: "hujan" };
      if (kode === 85 || kode === 86) return { teks: "Salju lebat", ik: "❄️", tema: "dingin" };
      if (kode >= 95) return { teks: "Badai petir", ik: "⛈️", tema: "badai" };
      return { teks: "Berawan", ik: "☁️", tema: "berawan" };
    }

    const $ = id => document.getElementById(id);
    function pesan(teks, error) {
      $("pesan").textContent = teks;
      $("pesan").className = "pesan" + (error ? " error" : "");
    }

    async function cariCuaca() {
      const nama = $("kotaInput").value.trim();
      if (!nama) return pesan("Ketik nama kota dulu.", true);
      pesan("Mencari data cuaca...");
      $("hasil").classList.add("hidden");

      try {
        const g = await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=id&name=" + encodeURIComponent(nama));
        const gd = await g.json();
        if (!gd.results || gd.results.length === 0) return pesan("Kota \"" + nama + "\" tidak ditemukan. Coba ejaan lain.", true);
        const k = gd.results[0];

        const url = "https://api.open-meteo.com/v1/forecast?latitude=" + k.latitude + "&longitude=" + k.longitude +
          "&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code" +
          "&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=6&timezone=auto";
        const r = await fetch(url);
        const d = await r.json();

        const c = d.current;
        const info = infoCuaca(c.weather_code);
        $("kota").textContent = k.name + (k.country ? ", " + k.country : "");
        $("suhu").textContent = Math.round(c.temperature_2m) + "°";
        $("kondisi").textContent = info.ik + " " + info.teks;
        $("detail").innerHTML = "<span>💧 Lembap " + c.relative_humidity_2m + "%</span><span>💨 Angin " + Math.round(c.wind_speed_10m) + " km/jam</span>";

        // 5 hari ke depan (lewati hari ini)
        const wadah = $("hari");
        wadah.innerHTML = "";
        for (let i = 1; i <= 5; i++) {
          const tgl = new Date(d.daily.time[i] + "T00:00:00");
          const inf = infoCuaca(d.daily.weather_code[i]);
          const kartu = document.createElement("div");
          kartu.className = "kartu";
          kartu.innerHTML =
            "<b>" + tgl.toLocaleDateString("id-ID", { weekday: "short" }).toUpperCase() + "</b>" +
            '<div class="ik">' + inf.ik + "</div>" +
            '<div class="mx">' + Math.round(d.daily.temperature_2m_max[i]) + "°</div>" +
            '<div class="mn">' + Math.round(d.daily.temperature_2m_min[i]) + "°</div>";
          wadah.appendChild(kartu);
        }

        $("hasil").classList.remove("hidden");
        pesan("");
        gantiTema(info.tema);
      } catch (e) {
        pesan("Gagal mengambil data. Cek koneksi internet lalu coba lagi.", true);
      }
    }

    $("cariBtn").onclick = cariCuaca;
    $("kotaInput").addEventListener("keydown", e => { if (e.key === "Enter") cariCuaca(); });

    gantiTema("cerah");
    cariCuaca();
  </script>
</body>
</html>
